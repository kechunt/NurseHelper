<div class="svg-icon-test-root">
  <header class="svg-icon-test-header">
    <div>
      <h1>SVG Custom · Prueba Neumórfica</h1>
      <p>
        Comparación visual de iconos SVG con <strong>relleno plano (flat)</strong> y apariencia
        <strong>neumórfica</strong> en un “tile” del mismo estilo que la app.
      </p>
    </div>
    <div class="svg-icon-test-header-actions">
      <a routerLink="/design-catalog" class="svg-icon-test-link">← Design catalog</a>
    </div>
  </header>

  <section class="svg-icon-test-grid" aria-label="Listado de iconos SVG">
    <div class="svg-icon-tile">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true">
        <!-- CSV -->
        <path
          fill="currentColor"
          d="M18 6h22l10 10v42a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
          opacity="0.9"
        />
        <path fill="#e0e5ec" d="M40 6v10h10z" />
        <path fill="currentColor" d="M22 26h20v4H22zM22 34h20v4H22zM22 42h14v4H22z" />
      </svg>
      <div class="svg-icon-tile-label"><app-hero-icon name="document-text" /> CSV</div>
    </div>

    <div class="svg-icon-tile">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true">
        <!-- Excel -->
        <path fill="currentColor" d="M18 6h22l10 10v42a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z" opacity="0.9" />
        <path fill="#e0e5ec" d="M40 6v10h10z" />
        <path
          fill="currentColor"
          d="M23 25h6v6h-6zm12 0h6v6h-6zM23 37h6v6h-6zm12 0h6v6h-6z"
        />
        <path fill="currentColor" d="M50 26l-7-7h7z" opacity="0.25" />
      </svg>
      <div class="svg-icon-tile-label"><app-hero-icon name="chart-bar" /> Excel</div>
    </div>

    <div class="svg-icon-tile">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true">
        <!-- Print -->
        <path
          fill="currentColor"
          d="M18 17a5 5 0 0 1 5-5h18a5 5 0 0 1 5 5v8h-6v-8H24v8h-6z"
          opacity="0.9"
        />
        <path fill="currentColor" d="M14 27h36a6 6 0 0 1 6 6v10h-10v8H18v-8H8V33a6 6 0 0 1 6-6z" />
        <path fill="#e0e5ec" d="M22 41h20v11H22z" />
      </svg>
      <div class="svg-icon-tile-label"><app-hero-icon name="printer" /> Imprimir</div>
    </div>

    <div class="svg-icon-tile">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true">
        <!-- Coordinación (2 personas) -->
        <path
          fill="currentColor"
          d="M24 28a10 10 0 1 0-0.01 0z"
          opacity="0.95"
        />
        <path
          fill="currentColor"
          d="M20 40c-8 2-12 7-12 14v4h24v-4c0-7-4-12-12-14z"
          opacity="0.95"
        />
        <path fill="currentColor" d="M50 28a10 10 0 1 0-0.01 0z" opacity="0.95" />
        <path fill="currentColor" d="M44 40c-8 2-12 7-12 14v4h24v-4c0-7-4-12-12-14z" opacity="0.95" />
      </svg>
      <div class="svg-icon-tile-label"><app-hero-icon name="clipboard-document-list" /> Coordinación</div>
    </div>

    <div class="svg-icon-tile">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true">
        <!-- Reports (bar chart) -->
        <path fill="currentColor" d="M14 50h36v4H14z" opacity="0.85" />
        <path fill="currentColor" d="M18 46V28h8v18z" />
        <path fill="currentColor" d="M30 46V18h8v28z" opacity="0.95" />
        <path fill="currentColor" d="M42 46V34h8v12z" opacity="0.9" />
        <path fill="currentColor" d="M14 20l8-8 8 10 12-16 8 10v4l-8-10-12 16-8-10-8 8z" opacity="0.25" />
      </svg>
      <div class="svg-icon-tile-label"><app-hero-icon name="chart-bar" /> Reportes</div>
    </div>

    <div class="svg-icon-tile svg-icon-tile--present">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true" style="color:#276749;">
        <!-- Present -->
        <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95" />
        <path fill="#e0e5ec" d="M26 35l-5-5 3-3 2 2 9-9 3 3z" />
      </svg>
      <div class="svg-icon-tile-label">Presente</div>
    </div>

    <div class="svg-icon-tile svg-icon-tile--late">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true" style="color:#b7791f;">
        <!-- Late -->
        <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95" />
        <path fill="#e0e5ec" d="M32 15a17 17 0 1 0 0.01 0z" opacity="0.15" />
        <path fill="#e0e5ec" d="M31 24h3v10h-3zM31 36h3v7h-3z" />
        <path fill="#e0e5ec" d="M32 18l7 7h-3v8h-8v-8h-3z" opacity="0.4" />
        <path fill="#e0e5ec" d="M32 32l7-5" stroke="#e0e5ec" stroke-width="3" stroke-linecap="round" />
      </svg>
      <div class="svg-icon-tile-label">Tarde</div>
    </div>

    <div class="svg-icon-tile svg-icon-tile--justified">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true" style="color:#2b6cb0;">
        <!-- Justified -->
        <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95" />
        <path fill="#e0e5ec" d="M22 20h20v8H22z" opacity="0.2" />
        <path fill="#e0e5ec" d="M22 26h20v18H22z" opacity="0.28" />
        <path fill="#e0e5ec" d="M26 35l4 4 10-12 3 3-13 15-7-7z" />
      </svg>
      <div class="svg-icon-tile-label">Justificada</div>
    </div>

    <div class="svg-icon-tile svg-icon-tile--absent">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true" style="color:#c53030;">
        <!-- Absent -->
        <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95" />
        <path fill="#e0e5ec" d="M25 25l14 14-3 3-14-14z" />
        <path fill="#e0e5ec" d="M39 25l3 3-14 14-3-3z" opacity="0.95" />
      </svg>
      <div class="svg-icon-tile-label">Ausente</div>
    </div>

    <div class="svg-icon-tile svg-icon-tile--missing">
      <svg class="svg-icon" viewBox="0 0 64 64" aria-hidden="true" style="color:#9f7aea;">
        <!-- Missing (warning) -->
        <circle cx="32" cy="32" r="22" fill="currentColor" opacity="0.95" />
        <path
          fill="#e0e5ec"
          d="M32 14l20 36H12z"
          opacity="0.25"
        />
        <path fill="#e0e5ec" d="M32 22l9 16H23z" opacity="0.6" />
        <rect x="29" y="30" width="6" height="14" rx="3" fill="#e0e5ec" />
        <circle cx="32" cy="48" r="3.2" fill="#e0e5ec" />
      </svg>
      <div class="svg-icon-tile-label">Falta</div>
    </div>
  </section>
</div>
