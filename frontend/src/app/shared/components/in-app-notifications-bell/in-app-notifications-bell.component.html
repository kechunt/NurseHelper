<div class="in-app-notif-wrap" (document:click)="closePanel()">
  <button
    type="button"
    class="notif-bell-trigger"
    [attr.id]="notificationBellToggleId"
    (click)="$event.stopPropagation(); togglePanel()"
    [attr.aria-expanded]="panelOpen"
    aria-label="Notificaciones"
    title="Notificaciones"
  >
    <i class="bi bi-bell notif-bell-icon" aria-hidden="true"></i>
    <span *ngIf="unreadCount() > 0" class="notif-badge">{{ unreadCount() > 99 ? '99+' : unreadCount() }}</span>
    <span *ngIf="pendingAckCount() > 0" class="notif-ack-dot" aria-hidden="true"></span>
  </button>

  <div
    *ngIf="panelOpen"
    class="notif-panel nh-neuro-surface-raised"
    [class.notif-panel--expanded]="expandedView"
    [attr.id]="notificationBellPanelId"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-label="Lista de notificaciones"
  >
    <div class="notif-panel-head">
      <span>Notificaciones <span class="notif-count-hint" *ngIf="items.length">({{ items.length }})</span></span>
      <div class="notif-head-actions">
        <button type="button" class="nh-neuro-link" (click)="toggleExpandedView($event)">
          {{ expandedView ? 'Vista compacta' : 'Ver todas' }}
        </button>
        <button
          type="button"
          class="nh-neuro-link"
          [attr.id]="notificationBellMarkAllReadId"
          (click)="markAllRead($event)"
        >
          Marcar todas leídas
        </button>
        <button
          type="button"
          class="nh-neuro-link"
          [attr.id]="notificationBellRefreshId"
          (click)="refresh(); $event.stopPropagation()"
        >
          Actualizar
        </button>
      </div>
    </div>

    <div class="notif-toolbar" *ngIf="items.length > 0">
      <button type="button" class="nh-neuro-link" (click)="toggleSelectionMode($event)">
        {{ selectionMode ? 'Cancelar selección' : 'Seleccionar' }}
      </button>
      <ng-container *ngIf="selectionMode">
        <button type="button" class="nh-neuro-link" (click)="selectAll($event)">Todas</button>
        <button type="button" class="nh-neuro-link" (click)="clearSelection($event)">Ninguna</button>
        <button
          type="button"
          class="nh-neuro-link nh-neuro-link--danger"
          [disabled]="selectedIds.size === 0 || bulkDeleting"
          (click)="deleteSelected($event)"
        >
          Eliminar ({{ selectedIds.size }})
        </button>
      </ng-container>
      <button
        type="button"
        class="nh-neuro-link nh-neuro-link--danger"
        [disabled]="bulkDeleting"
        (click)="deleteAll($event)"
      >
        Eliminar todas
      </button>
    </div>

    <div *ngIf="loading" [attr.id]="notificationBellLoadingId" class="notif-muted">Cargando…</div>
    <ul *ngIf="!loading" class="notif-list">
      <li *ngIf="items.length === 0" [attr.id]="notificationBellEmptyId" class="notif-muted">
        No hay notificaciones activas.
      </li>
      <li
        *ngFor="let n of items"
        class="notif-row"
        [class.sev-info]="n.severity === 'info'"
        [class.sev-warning]="n.severity === 'warning'"
        [class.sev-critical]="n.severity === 'critical'"
        [class.unread]="!n.readAt"
        [class.selected]="selectionMode && isSelected(n.id)"
      >
        <label *ngIf="selectionMode" class="notif-row-select">
          <input type="checkbox" [checked]="isSelected(n.id)" (change)="toggleSelected(n.id, $event)" />
        </label>
        <button
          type="button"
          class="notif-row-main"
          [attr.id]="notificationBellRowOpenBtnId(n)"
          (click)="onRowClick(n)"
        >
          <span class="notif-meta">{{ formatCreatedAt(n.createdAt) }}</span>
          <span class="notif-title">{{ n.title }}</span>
          <span class="notif-body">{{ n.body }}</span>
        </button>
        <div class="notif-row-actions" *ngIf="!selectionMode">
          <button
            *ngIf="!n.readAt"
            type="button"
            class="nh-neuro-btn-sm"
            [attr.id]="notificationBellRowMarkReadBtnId(n)"
            (click)="markRead(n, $event)"
          >
            Leída
          </button>
          <button
            *ngIf="n.requiresAck && !n.acknowledgedAt"
            type="button"
            class="nh-neuro-btn-sm nh-neuro-btn-sm--primary"
            [attr.id]="notificationBellRowAcknowledgeBtnId(n)"
            (click)="acknowledge(n, $event)"
          >
            Aceptar
          </button>
          <button
            type="button"
            class="nh-neuro-btn-sm nh-neuro-btn-sm--danger"
            [attr.id]="notificationBellRowRemoveBtnId(n)"
            (click)="remove(n, $event)"
          >
            Quitar
          </button>
        </div>
      </li>
    </ul>
  </div>
</div>
