<app-dashboard-user-profile-modal #dashProfileModal />

<div id="dashboard-shell-header" class="dashboard-header">
  <div class="header-content">
    <div
      id="dashboard-shell-logo-section"
      class="logo-section"
      role="button"
      tabindex="0"
      [attr.aria-label]="logoSectionAriaLabel ?? null"
      (click)="logoClick.emit()"
      (keydown.enter)="logoClick.emit()"
      (keydown.space)="logoClick.emit(); $event.preventDefault()"
    >
      <img
        src="/nursehelper.png"
        class="header-logo"
        [attr.alt]="headerLogoAlt !== null && headerLogoAlt !== undefined ? headerLogoAlt : 'NurseHelper'"
      />
      <div class="title-section">
        <h1 class="dashboard-title" [attr.id]="panelHeadingId || null">{{ panelTitle }}</h1>
        <span class="dashboard-subtitle" *ngIf="subtitle">{{ subtitle }}</span>
      </div>
    </div>
    <div class="user-section">
      <ng-content select="[appDashboardHeaderActions]"></ng-content>
      <button
        *ngIf="profileEditable"
        id="dashboard-shell-profile-trigger-btn"
        type="button"
        class="user-info profile-trigger-btn"
        (click)="dashProfileModal.open()"
        title="Editar mi información"
        aria-label="Editar mi información de usuario"
      >
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ roleLabel }}</span>
      </button>
      <div *ngIf="!profileEditable" class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ roleLabel }}</span>
      </div>
      <button
        id="dashboard-shell-logout-btn"
        type="button"
        class="neuro-btn-icon logout-btn"
        (click)="onLogout()"
        title="Cerrar Sesión"
        aria-label="Cerrar sesión"
      >
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<div id="dashboard-shell-body" class="dashboard-body">
  <!-- Overlay para cerrar el nav en mobile al tocar fuera -->
  <div
    id="dashboard-shell-nav-mobile-overlay"
    class="nav-mobile-overlay"
    [class.visible]="navOpen"
    (click)="closeNav()"
    aria-hidden="true"
  ></div>

  <nav
    id="dashboard-shell-nav"
    class="dashboard-nav"
    [class.nav-open]="navOpen"
    [attr.aria-label]="navAriaLabel"
    [attr.role]="navRoleTablist ? 'tablist' : null"
    (click)="onNavClick($event)"
  >
    <!-- Botón cerrar dentro del menú (mobile) -->
    <button
      id="dashboard-shell-nav-mobile-close-btn"
      type="button"
      class="nav-mobile-close"
      (click)="closeNav()"
      aria-label="Cerrar menú"
    >✕</button>

    <ng-content select="[appDashboardNav]"></ng-content>
  </nav>

  <div id="dashboard-shell-main-wrapper" class="dashboard-main-wrapper">
    <!-- Botón hamburguesa (solo visible en mobile) -->
    <button
      id="dashboard-shell-nav-hamburger-btn"
      type="button"
      class="nav-hamburger"
      (click)="toggleNav()"
      [attr.aria-expanded]="navOpen"
      aria-label="Abrir menú de navegación"
    >
      <span class="hamburger-label">Menú</span>
      <span class="hamburger-icon">☰</span>
    </button>

    <div id="dashboard-shell-main-slot" class="dashboard-shell-main-slot">
      <ng-content></ng-content>
    </div>
  </div>
</div>

<div id="dashboard-shell-overlays-slot" class="dashboard-shell-overlays-slot">
  <ng-content select="[appDashboardOverlays]"></ng-content>
</div>
