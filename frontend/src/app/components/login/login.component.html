<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-logo-wrap">
      <img
        src="/nursehelper.png"
        alt="NurseHelper Logo"
        class="auth-logo"
      />
    </div>

    <h1 class="auth-title">Iniciar Sesión</h1>
    <p class="auth-subtitle">Ingresa a NurseHelper</p>

    <form id="login-form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-input-group">
        <label for="usernameOrEmail">Usuario o Correo</label>
        <input
          type="text"
          id="usernameOrEmail"
          class="neuro-input"
          placeholder="usuario o correo@ejemplo.com"
          [(ngModel)]="usernameOrEmail"
          name="usernameOrEmail"
          required
        />
      </div>

      <div class="auth-input-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="neuro-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
          <button
            id="login-password-toggle-btn"
            type="button"
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <app-bootstrap-icon [name]="showPassword ? 'eye-slash' : 'eye'" />
          </button>
        </div>
      </div>

      <div *ngIf="error" class="auth-error">{{ error }}</div>

      <button
        id="login-submit-btn"
        type="submit"
        class="neuro-btn"
        [disabled]="loading"
      >
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>
        ¿No tienes cuenta?
        <a id="login-register-link" routerLink="/register" class="auth-link">Regístrate aquí</a>
      </p>
    </div>
  </div>
</div>
