<div class="admin-dashboard">
  <div class="dashboard-header">
    <div class="header-content">
      <div class="logo-section" (click)="goToOverviewFromLogo()" role="button" tabindex="0" (keydown.enter)="goToOverviewFromLogo()" (keydown.space)="goToOverviewFromLogo(); $event.preventDefault()">
        <img src="/nursehelper.png" alt="NurseHelper" class="header-logo" />
        <div class="title-section">
          <h1 class="dashboard-title">Panel de Administración</h1>
        </div>
      </div>
      <div class="user-section">
        <button class="user-info profile-trigger-btn" (click)="openProfileModal()" title="Editar mi información">
          <span class="user-name">{{ currentUser()?.firstName || '' }} {{ currentUser()?.lastName || '' }}</span>
          <span class="user-role">Administrador</span>
        </button>
        <button class="neuro-btn-icon logout-btn" (click)="logout()" title="Cerrar Sesión">
          🚪
        </button>
      </div>
    </div>
  </div>

  <div class="dashboard-body">
    <nav class="dashboard-nav">
      <button
        class="nav-link"
        [class.active]="activeTab === 'overview'"
        (click)="setActiveTab('overview')"
      >
        📊 Resumen
      </button>
      <button
        class="nav-link"
        [class.active]="activeTab === 'users'"
        (click)="setActiveTab('users')"
      >
        👥 Usuarios
      </button>
      <button
        class="nav-link"
        [class.active]="activeTab === 'staff'"
        (click)="setActiveTab('staff')"
      >
        👩‍⚕️ Gestión de Enfermeras
      </button>
      <button
        class="nav-link"
        [class.active]="activeTab === 'areas'"
        (click)="setActiveTab('areas')"
      >
        🏥 Áreas
      </button>
      <button
        class="nav-link"
        [class.active]="activeTab === 'beds'"
        (click)="setActiveTab('beds')"
      >
        🛏️ Camas
      </button>
      <button
        class="nav-link"
        [class.active]="activeTab === 'patients'"
        (click)="setActiveTab('patients')"
      >
        👤 Pacientes
      </button>
      <button
        class="nav-link"
        [class.active]="activeTab === 'schedules'"
        (click)="setActiveTab('schedules')"
      >
        📅 Horarios
      </button>
    </nav>

    <div class="dashboard-content">
      <!-- Resumen: *ngIf solo la primera vez; [hidden] evita destruir el componente al cambiar de pestaña -->
      <div *ngIf="hasVisitedTab('overview')" [hidden]="activeTab !== 'overview'" class="tab-content">
        <app-overview [onNavigate]="setActiveTab.bind(this)"></app-overview>
      </div>

      <div *ngIf="hasVisitedTab('users')" [hidden]="activeTab !== 'users'" class="tab-content">
        <app-users-management></app-users-management>
      </div>

      <div *ngIf="hasVisitedTab('staff')" [hidden]="activeTab !== 'staff'" class="tab-content">
        <app-staff-management></app-staff-management>
      </div>

      <div *ngIf="hasVisitedTab('areas')" [hidden]="activeTab !== 'areas'" class="tab-content">
        <app-areas-management></app-areas-management>
      </div>

      <div *ngIf="hasVisitedTab('beds')" [hidden]="activeTab !== 'beds'" class="tab-content">
        <app-beds-management></app-beds-management>
      </div>

      <div *ngIf="hasVisitedTab('patients')" [hidden]="activeTab !== 'patients'" class="tab-content">
        <app-patients-management></app-patients-management>
      </div>

      <div *ngIf="hasVisitedTab('schedules')" [hidden]="activeTab !== 'schedules'" class="tab-content">
        <app-schedules-management></app-schedules-management>
      </div>
    </div>
  </div>
</div>

<div *ngIf="showProfileModal" class="modal-backdrop" (click)="closeProfileModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>✏️ Editar Usuario</h3>
      <button class="close-btn" (click)="closeProfileModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="input-group">
          <label for="profile-firstName">Nombre *</label>
          <input
            type="text"
            id="profile-firstName"
            class="neuro-input"
            [(ngModel)]="profileForm.firstName"
            placeholder="Ingrese el nombre"
          />
        </div>
        <div class="input-group">
          <label for="profile-lastName">Apellido *</label>
          <input
            type="text"
            id="profile-lastName"
            class="neuro-input"
            [(ngModel)]="profileForm.lastName"
            placeholder="Ingrese el apellido"
          />
        </div>
        <div class="input-group">
          <label for="profile-username">Usuario *</label>
          <input
            type="text"
            id="profile-username"
            class="neuro-input"
            [(ngModel)]="profileForm.username"
            placeholder="Ingrese el nombre de usuario"
          />
        </div>
        <div class="input-group">
          <label for="profile-email">Email *</label>
          <input
            type="email"
            id="profile-email"
            class="neuro-input"
            [(ngModel)]="profileForm.email"
            placeholder="usuario@ejemplo.com"
          />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="neuro-btn outlined" (click)="closeProfileModal()">Cancelar</button>
      <button class="neuro-btn" (click)="saveProfile()" [disabled]="savingProfile">
        {{ savingProfile ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  </div>
</div>
