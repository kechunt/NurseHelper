<app-staff-dashboard-shell
  #staffShell
  idPrefix="admin"
  [dashboardTitle]="adminShellDashboardTitle"
  panelHeadingId="admin-dashboard-heading"
  notificationsKind="admin"
  [roleDisplayLabel]="adminShellRoleDisplayLabel"
  [logoAriaLabel]="adminShellLogoAriaLabel"
  [navAriaLabel]="adminShellNavAriaLabel"
  [activeTab]="tabState.activeTab()"
  [userDisplayName]="headerUserDisplayName"
  [mobileDrawer]="true"
  (logoClick)="goToOverviewFromLogo()"
  (tabSelected)="setActiveTab($event)"
  (logoutClick)="logout()"
>
  <div staffShellTop>
    <app-admin-nurse-pick-modal-host />
  </div>

  <app-staff-dashboard-quick-actions-toolbar staffShellNavEnd />

  <div staffShellQuickModals>
    <app-staff-dashboard-quick-actions-modals />
  </div>

  <main
    staffShellMain
    class="dashboard-content"
    id="admin-dashboard-main"
    aria-labelledby="admin-dashboard-heading"
  >
    <button
      id="admin-shell-nav-hamburger-btn"
      type="button"
      class="nav-hamburger"
      (click)="staffShell.toggleNav()"
      [attr.aria-expanded]="staffShell.navOpen"
      [attr.aria-label]="adminHamburgerOpenNavAriaLabel"
    >
      <span class="hamburger-label">{{ hamburgerSectionLabel }}</span>
      <span class="hamburger-icon">☰</span>
    </button>

    <div
      *ngIf="hasVisitedTab('overview')"
      [hidden]="tabState.activeTab() !== 'overview'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-overview"
      aria-labelledby="admin-tab-overview"
    >
      <app-overview
        [tabActive]="tabState.activeTab() === 'overview'"
        [onNavigate]="setActiveTab.bind(this)"
        [onOpenCoordination]="openCoordination.bind(this)"
        [onOpenReports]="openReports.bind(this)"
      ></app-overview>
    </div>

    <div
      *ngIf="hasVisitedTab('users')"
      [hidden]="tabState.activeTab() !== 'users'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-users"
      aria-labelledby="admin-tab-users"
    >
      <app-users-management></app-users-management>
    </div>

    <div
      *ngIf="hasVisitedTab('staff')"
      [hidden]="tabState.activeTab() !== 'staff'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-staff"
      aria-labelledby="admin-tab-staff"
    >
      <app-staff-management [tabActive]="tabState.activeTab() === 'staff'"></app-staff-management>
    </div>

    <div
      *ngIf="hasVisitedTab('areas')"
      [hidden]="tabState.activeTab() !== 'areas'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-areas"
      aria-labelledby="admin-tab-areas"
    >
      <app-pharmacy-coverage-summary-card />
      <app-areas-management></app-areas-management>
    </div>

    <div
      *ngIf="hasVisitedTab('beds')"
      [hidden]="tabState.activeTab() !== 'beds'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-beds"
      aria-labelledby="admin-tab-beds"
    >
      <app-beds-management></app-beds-management>
    </div>

    <div
      *ngIf="hasVisitedTab('patients')"
      [hidden]="tabState.activeTab() !== 'patients'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-patients"
      aria-labelledby="admin-tab-patients"
    >
      <app-patients-management [tabActive]="tabState.activeTab() === 'patients'"></app-patients-management>
    </div>

    <div
      *ngIf="hasVisitedTab('schedules')"
      [hidden]="tabState.activeTab() !== 'schedules'"
      class="tab-content"
      role="tabpanel"
      id="admin-panel-schedules"
      aria-labelledby="admin-tab-schedules"
    >
      <app-schedules-management [tabActive]="tabState.activeTab() === 'schedules'"></app-schedules-management>
    </div>
  </main>
</app-staff-dashboard-shell>
