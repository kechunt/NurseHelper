<div 
  *ngIf="show"
  id="confirmation-modal-overlay"
  class="modal-overlay"
  appModalFocusTrap
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'modal-title-' + type"
  [attr.aria-describedby]="'modal-description-' + type"
  (click)="close()"
>
  <div 
    class="modal-content modal-{{ type }}"
    (click)="$event.stopPropagation()"
    appKeyboardNav="vertical"
  >
    <div class="modal-header">
      <h2 [id]="'modal-title-' + type" class="modal-title">{{ title }}</h2>
      <button 
        id="confirmation-modal-header-close-btn"
        type="button"
        class="modal-close"
        (click)="close()"
        aria-label="Cerrar modal"
        i18n-aria-label="@@confirmationModal.closeAriaLabel"
        tabindex="0"
      >
        <span aria-hidden="true">×</span>
      </button>
    </div>
    
    <div class="modal-body">
      <p [id]="'modal-description-' + type">{{ message }}</p>
    </div>
    
    <div class="modal-footer">
      <button 
        id="confirmation-modal-cancel-btn"
        type="button"
        class="btn btn-secondary"
        (click)="cancel()"
        tabindex="0"
      >
        {{ cancelText }}
      </button>
      <button 
        id="confirmation-modal-confirm-btn"
        type="button"
        class="btn btn-{{ type === 'danger' ? 'danger' : 'primary' }}"
        (click)="confirm()"
        tabindex="0"
        [attr.aria-label]="confirmText + ' - ' + title"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
