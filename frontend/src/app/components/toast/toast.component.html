<div 
  class="toast toast-{{ toast.type }}"
  role="alert"
  [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'"
  [attr.aria-label]="getAriaLabel(toast.type)"
  [attr.aria-atomic]="true"
>
  <div class="toast-content">
    <span class="toast-icon" aria-hidden="true">{{ getIcon(toast.type) }}</span>
    <div class="toast-message">
      <p>{{ toast.message }}</p>
      <div *ngIf="toast.action" class="toast-action">
        <button 
          type="button"
          class="toast-action-button"
          (click)="handleAction()"
          [attr.aria-label]="'Ejecutar acción: ' + toast.action.label"
        >
          {{ toast.action.label }}
        </button>
      </div>
    </div>
    <button 
      type="button"
      class="toast-close"
      (click)="close()"
      aria-label="Cerrar notificación"
      tabindex="0"
    >
      <span aria-hidden="true">×</span>
    </button>
  </div>
  <div class="toast-progress" *ngIf="toast.duration && toast.duration > 0">
    <div class="toast-progress-bar" [style.animation-duration]="toast.duration + 'ms'"></div>
  </div>
</div>
