<app-dashboard-shell
  panelSkin="nurse-dashboard"
  topAnchorId="dashboard-top"
  [panelTitle]="nurseShellPanelTitle"
  [subtitle]="assignedArea || null"
  [userName]="headerUserName"
  [roleLabel]="nurseShellRoleLabel"
  [profileEditable]="true"
  [navAriaLabel]="nurseShellNavAriaLabel"
  panelHeadingId="nurse-dashboard-heading"
  [headerLogoAlt]="''"
  [logoSectionAriaLabel]="nurseShellLogoSectionAriaLabel"
  (logoClick)="goToSummaryFromLogo()"
  (logoutClick)="logout()"
>
  <div id="nurse-dashboard-shell-header-actions" appDashboardHeaderActions class="nurse-header-actions">
    <app-in-app-notifications-bell dashboardKind="nurse" />
    <app-nurse-dashboard-header-search (debounced)="onHeaderPatientSearch($event)" />
  </div>

  <ng-container appDashboardNav>
    <app-nurse-dashboard-main-nav
      [nurseMainView]="nurseMainView"
      [handoverPendingNotice]="handoverPendingNotice"
      (viewSelect)="setNurseMainView($event)"
      (entregaClick)="openHandoverModal()"
      (reportesClick)="openNurseReportsModal()"
    />
  </ng-container>

  <main class="dashboard-content" id="nurse-dashboard-main" aria-labelledby="nurse-dashboard-heading">
      <div
        *ngIf="hasVisitedNurseView('summary')"
        [hidden]="nurseMainView !== 'summary'"
        class="tab-content"
        role="tabpanel"
        id="nurse-panel-summary"
        aria-labelledby="nurse-tab-summary"
      >
        <div class="section-card nurse-module nurse-summary-shell">
          <app-nurse-summary-section
            [assignedArea]="assignedArea"
            [assignedPatientsCount]="assignedPatientsCount"
            [maxPatients]="maxPatients"
            [pendingTasksCount]="pendingTasksCount"
            [medicationsToday]="medicationsToday"
            [attentionPharmacyNotRequestedCount]="attentionPharmacyNotRequestedCount"
            [attentionTasksNextHourCount]="attentionTasksNextHourCount"
            (areaSummaryClick)="showAreaInfo()"
            (openPatientsModuleClick)="filterByPatients()"
            (openTasksQuickClick)="openTasksQuickModal()"
            (openPharmacyQuickClick)="navigateToPharmacyTab()"
            (openAttentionPharmacyClick)="goAttentionPharmacyPending()"
            (openAttentionTasksNextHourClick)="goAttentionTasksNextHour()"
            (openHandoverClick)="openHandoverModal()"
            (openReportsClick)="openNurseReportsModal()"
          />
        </div>
      </div>

  <div
    *ngIf="hasVisitedNurseView('tasks')"
    [hidden]="nurseMainView !== 'tasks'"
    class="tab-content"
    role="tabpanel"
    id="nurse-panel-tasks"
    aria-labelledby="nurse-tab-tasks"
  >
    <div class="section-card nurse-module">
      <div id="nurse-tasks-module-stack" class="nurse-module-stack nurse-tasks-module-stack">
        <app-nurse-tasks-section
          [patients]="patients"
          [tasksGroupedByHour]="tasksGroupedByHour"
          [tasksPatientFilter]="tasksPatientFilter"
          [tasksHourFilter]="tasksHourFilter"
          [tasksDayHistoryDate]="tasksDayHistoryDate"
          [tasksDayHistoryItems]="tasksDayHistoryItems"
          [tasksDayHistoryLoading]="tasksDayHistoryLoading"
          [tasksDayHistoryError]="tasksDayHistoryError"
          (tasksPatientFilterChange)="tasksPatientFilter = $event; applyTasksFilters()"
          (tasksHourFilterChange)="tasksHourFilter = $event; applyTasksFilters()"
          (clearTaskFilters)="clearTasksFilters()"
          (addTaskClick)="openAddTaskModal()"
          (addMedicationFromTasksClick)="openAddMedicationFromTasks()"
          (openTaskDetail)="openPendingTaskDetail($event)"
          (dayHistoryDateChange)="tasksDayHistoryDate = $event; loadTasksDayHistory()"
          (exportDayHistoryCsvClick)="exportTasksDayHistoryCsv()"
          (exportDayHistoryPdfClick)="exportTasksDayHistoryPdf()"
        />
      </div>
    </div>
  </div>

  <!-- Sección de Solicitud de Medicamentos -->
  <div
    *ngIf="hasVisitedNurseView('pharmacy')"
    [hidden]="nurseMainView !== 'pharmacy'"
    class="tab-content"
    role="tabpanel"
    id="nurse-panel-pharmacy"
    aria-labelledby="nurse-tab-pharmacy"
  >
    <div class="section-card nurse-module">
      <div id="pharmacy-section" class="nurse-module-stack">
        <app-nurse-pharmacy-section
          [medicationsForPharmacy]="medicationsForPharmacy"
          [pharmacyContactsByShift]="pharmacyContactsByShift"
          [uniqueMedicationsCount]="uniqueMedicationsCount"
          [totalDosesToday]="totalDosesToday"
          [historyOpen]="pharmacyRequestsHistoryOpen"
          [historyDate]="pharmacyRequestHistoryDate"
          [historyLoading]="pharmacyRequestHistoryLoading"
          [historyError]="pharmacyRequestHistoryError"
          [historyItems]="pharmacyRequestHistoryItems"
          (sendRequest)="sendPharmacyRequest()"
          (viewPatients)="openPharmacyPatientsModal($event)"
          (toggleHistory)="togglePharmacyRequestsHistory()"
          (historyDateChange)="onPharmacyHistoryDateChange($event)"
        />
      </div>
    </div>
  </div>

  <!-- Sección de Camas Asignadas -->
  <div
    *ngIf="hasVisitedNurseView('beds')"
    [hidden]="nurseMainView !== 'beds'"
    class="tab-content"
    role="tabpanel"
    id="nurse-panel-beds"
    aria-labelledby="nurse-tab-beds"
  >
    <app-nurse-beds-section
      [myBeds]="bedsDisplayWithClinical"
      [assignedArea]="assignedArea"
      (bedEditRequest)="openEditBedModal($event)"
      (viewPatientRequest)="viewPatientDetails($event)"
    />
  </div>

  <!-- Tabla de Pacientes Mejorada -->
  <div
    *ngIf="hasVisitedNurseView('patients')"
    [hidden]="nurseMainView !== 'patients'"
    class="tab-content"
    role="tabpanel"
    id="nurse-panel-patients"
    aria-labelledby="nurse-tab-patients"
  >
    <div class="section-card nurse-module">
    <div id="patients-section" class="nurse-module-stack">
      <app-nurse-patients-assigned-section
        [patients]="filteredPatients"
        [searchTerm]="searchTerm"
        [selectedFilter]="selectedFilter"
        [medicationDosesToday]="todayMedicationDosesCountForList"
        [treatmentsTodayCount]="todayTreatmentsCountForList"
        (searchTermChange)="onPatientsSectionSearch($event)"
        (selectedFilterChange)="onPatientsSectionFilter($event)"
        (clearPatientFiltersClick)="clearPatientsSectionFilters()"
        (openPatientDetails)="openPatientModal($event)"
        (openPatientMedicationSchedule)="openPatientModal($event, 'schedule')"
      />
    </div>
    </div>
  </div>
  </main>

  <div appDashboardOverlays>
    <app-nurse-dashboard-overlays-stack
      [vm]="overlaysStackVm"
      (pharmacyPatientsDismissed)="closePharmacyPatientsModal()"
      (notCompletedDismissed)="closeNotCompletedModal()"
      (notCompletedConfirmed)="onNotCompletedTaskConfirmed($event)"
      (patientModalClosed)="closePatientModal()"
      (patientModalPdfRequested)="exportPatientPdf()"
      (patientExportCsvRequested)="exportPatientTab($event.tab)"
      (patientActiveTabChange)="activeTab = $event"
      (patientNewDiagnosisNoteChange)="newDiagnosisNote = $event"
      (patientNewMedicalObservationNoteChange)="newMedicalObservationNote = $event"
      (patientNewAllergiesNoteChange)="newAllergiesNote = $event"
      (patientNewSpecialNeedsNoteChange)="newSpecialNeedsNote = $event"
      (patientNewGeneralObservationNoteChange)="newGeneralObservationNote = $event"
      (patientAddMedication)="openAddMedicationModal()"
      (patientOpenMedicationDayDetail)="openMedicationDayDetailModal($event)"
      (patientMarkMedicationGiven)="markMedicationSlotGiven($event)"
      (patientMarkMedicationNotAdministered)="markMedicationSlotNotAdministered($event)"
      (patientSuspendMedication)="suspendMedicationFromSlot($event)"
      (patientReactivateMedication)="reactivateMedicationFromSlot($event)"
      (patientDeleteMedicationSlot)="deleteMedicationSlot($event)"
      (patientAddTreatment)="openAddTreatmentForSelectedPatient()"
      (patientOpenTreatmentSlotDetail)="openTreatmentSlotDetailModal($event)"
      (patientMarkTreatmentDone)="acceptTreatmentSchedule($event)"
      (patientPostponeTreatment)="openTreatmentPostponeModal($event)"
      (patientCancelTreatment)="cancelTreatmentSchedule($event)"
      (patientEditTreatmentSchedule)="openTreatmentSlotScheduleEdit($event)"
      (patientDeleteTreatmentSlot)="deleteTreatmentSlot($event)"
      (patientSaveDiagnosis)="saveDiagnosis($event)"
      (patientSaveMedicalObservations)="saveMedicalObservations($event)"
      (patientSaveAllergies)="saveAllergies($event)"
      (patientSaveSpecialNeeds)="saveSpecialNeeds($event)"
      (patientSaveGeneralObservationsFull)="saveGeneralObservationsFull($event)"
      (patientSaveClinicalAppend)="saveClinicalAppend($event)"
      (patientHistoryPeriodChange)="historyFilter = $event"
      (patientHistoryOutcomeChange)="historyOutcomeFilter = $event"
      (patientHistoryOpenDetail)="openHistoryDetail($event)"
      (patientHistoryOpenEdit)="openHistoryEdit($event)"
      (patientHistoryDeleteRecord)="deleteHistoryRecord($event)"
      (patientHistoryEditDismissed)="closeHistoryEdit()"
      (patientHistoryEditSaved)="onHistoryEditSaved()"
      (patientScheduleEditDismissed)="closeScheduleEdit()"
      (patientScheduleEditSaved)="onScheduleEditSaved()"
      (historyDetailDismissed)="closeHistoryDetail()"
      (medicationDayDetailDismissed)="closeMedicationDayDetailModal()"
      (pendingTaskDetailDismissed)="closePendingTaskDetail()"
      (pendingTaskDetailCompleteRequested)="onPendingTaskDetailComplete($event)"
      (pendingTaskDetailNotCompletedRequested)="onPendingTaskDetailNotCompleted($event)"
      (pendingTaskDetailPostponeRequested)="onPendingTaskDetailPostpone($event)"
      (handoverDateChange)="handoverDate = $event"
      (handoverDateCommitted)="onHandoverDateChange()"
      (handoverShiftChange)="onHandoverShiftPick($event)"
      (handoverShiftCommitted)="onHandoverShiftChange()"
      (handoverBodyChange)="handoverBody = $event"
      (handoverDismissed)="closeHandoverModal()"
      (handoverAcknowledgeRequested)="acknowledgeHandoverRead()"
      (handoverSaveRequested)="saveHandoverNote()"
      (nurseReportsDismissed)="closeNurseReportsModal()"
      (nurseReportsCsvDownload)="downloadNurseReportCsv($event)"
      (nurseReportsPdfDownload)="downloadNurseReportPdf($event)"
      (tasksQuickPatientFilterChange)="tasksPatientFilter = $event; applyTasksFilters()"
      (tasksQuickHourFilterChange)="tasksHourFilter = $event; applyTasksFilters()"
      (tasksQuickClearFilters)="clearTasksFilters()"
      (tasksQuickOpenTaskDetail)="openPendingTaskDetail($event)"
      (tasksQuickDismissed)="closeTasksQuickModal()"
      (tasksQuickOpenFullModule)="goToFullTasksFromQuick()"
      (scheduleSlotsDismissed)="closeScheduleSlotsModal()"
      (addMedicationDismissed)="closeAddMedicationModal()"
      (addMedicationSaved)="onAddMedicationSaved($event)"
      (suspendMedicationDismissed)="closeSuspendMedicationModal()"
      (suspendMedicationConfirmed)="onSuspendMedicationConfirmed($event)"
      (addTreatmentDismissed)="closeAddTreatmentModal()"
      (addTreatmentSaved)="onAddTreatmentSaved($event)"
      (deleteMedicationDismissed)="closeDeleteMedicationModal()"
      (deleteMedicationConfirmed)="onDeleteMedicationConfirmed($event)"
      (treatmentPostponeDismissed)="closeTreatmentPostponeModal()"
      (treatmentPostponeConfirmed)="onTreatmentPostponeConfirmed($event)"
      (reactivateMedicationDismissed)="closeReactivateMedicationModal()"
      (reactivateMedicationConfirmed)="onReactivateMedicationConfirmed()"
      (postponeTaskDismissed)="closePostponeTaskModal()"
      (postponeTaskConfirmed)="onPostponeTaskConfirmed($event)"
      (editBedDismissed)="closeEditBedModal()"
      (editBedSaved)="onEditBedSaved()"
      (editBedReloadRequested)="loadNurseData()"
    />
  </div>
</app-dashboard-shell>
