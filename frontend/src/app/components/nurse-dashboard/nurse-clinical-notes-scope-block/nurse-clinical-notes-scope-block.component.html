<div class="ncnsb" [class.ncnsb--compact]="compact">

  <div *ngIf="blockLabel" class="ncnsb__block-label">{{ blockLabel }}</div>



  <div

    class="ncnsb__preview"

    [class.ncnsb__preview--clickable]="effectiveNotes().length > 0"

    (click)="onPreviewStripClick($event)"

    role="group"

    [attr.aria-label]="blockLabel || ncnsbPreviewAria"

  >

    <button

      *ngFor="let note of previewNotes()"

      type="button"

      class="ncnsb__preview-line-main ncnsb__preview-line-main--block"

      (click)="openDetail(note); $event.stopPropagation()"

    >

      <span class="ncnsb__preview-text">{{ displayBody(note) }}</span>

    </button>

    <p *ngIf="effectiveNotes().length === 0" class="ncnsb__empty">{{ emptyLabel || ncnsbEmptyDefault }}</p>

  </div>



  <button
    *ngIf="effectiveNotes().length > 0 && !externalExpand"
    type="button"
    class="ncnsb__expand-btn neuro-btn neuro-btn-sm"
    (mousedown)="$event.stopPropagation()"
    (click)="onExpandClick($event)"
  >
    {{ expandAllLabel(effectiveNotes().length) }}
  </button>



  <!-- Lista completa: elige 0–3 visibles fuera -->

  <div

    *ngIf="listModalOpen"

    class="modal-backdrop modal-confirmation ncnsb-notes-list-backdrop"

    role="presentation"

    (click)="closeList()"

  >

    <div

      class="modal-content modal-small nurse-aux-modal ncnsb-notes-list-dialog"

      role="dialog"

      aria-modal="true"

      aria-labelledby="ncnsb-list-title"

      (click)="$event.stopPropagation()"

    >

      <div class="modal-header">

        <h3 id="ncnsb-list-title">{{ blockLabel || ncnsbListTitleFallback }}</h3>

        <button

          type="button"

          class="close-btn"

          (click)="closeList()"

          [attr.aria-label]="ncnsbCloseAria"

        >

          ✕

        </button>

      </div>



      <div class="modal-body ncnsb-notes-list-body">

        <p class="ncnsb-list-hint">{{ ncnsbListHint }}</p>

        <ul class="ncnsb-list-ul">

          <li *ngFor="let note of listNotesSorted()" class="ncnsb-list-li">

            <div class="ncnsb-list-row-wrap">

              <button

                type="button"

                class="ncnsb-notes-eye-btn"

                [class.ncnsb-notes-eye-btn--active]="isPinned(note)"

                [attr.aria-pressed]="isPinned(note)"

                (click)="onTogglePin($event, note)"

                [title]="ncnsbPinTitle"

                [attr.aria-label]="ncnsbPinAria"

              >

                <app-bootstrap-icon name="eye" />

              </button>

              <button type="button" class="ncnsb-list-row-main" (click)="openDetail(note)">

                <span class="ncnsb-list-body">{{ displayBody(note) }}</span>

              </button>

            </div>

          </li>

        </ul>

      </div>



      <div class="modal-footer nurse-aux-modal__footer">

        <button

          type="button"

          class="btn-secondary-neuro ncnsb-notes-footer-btn"

          (click)="closeList()"

          i18n="@@ncnsb.listDoneClose"

        >

          Cerrar

        </button>

      </div>

    </div>

  </div>



  <!-- Detalle con fecha y hora -->

  <div

    *ngIf="detailNote as dn"

    class="modal-backdrop modal-confirmation ncnsb-notes-detail-backdrop"

    role="presentation"

    (click)="closeDetail()"

  >

    <div

      class="modal-content modal-small nurse-aux-modal ncnsb-notes-detail-dialog"

      role="dialog"

      aria-modal="true"

      aria-labelledby="ncnsb-detail-title"

      (click)="$event.stopPropagation()"

    >

      <div class="modal-header">

        <h3 id="ncnsb-detail-title" i18n="@@ncnsb.detailTitle">Detalle de la observación</h3>

        <button

          type="button"

          class="close-btn"

          (click)="closeDetail()"

          [attr.aria-label]="ncnsbCloseAria"

        >

          ✕

        </button>

      </div>



      <div class="modal-body ncnsb-notes-detail-body">

        <dl class="ncnsb-detail-meta">

          <dt i18n="@@ncnsb.detailMetaAuthor">Enfermera / autor</dt>

          <dd>{{ detailAuthorLabel(dn) }}</dd>

          <dt i18n="@@ncnsb.detailMetaDate">Fecha</dt>

          <dd>{{ detailDateLabel(dn) }}</dd>

          <dt i18n="@@ncnsb.detailMetaTime">Hora</dt>

          <dd>{{ detailTimeLabel(dn) }}</dd>

        </dl>

        <p class="ncnsb-detail-body-label" i18n="@@ncnsb.detailBodyLabel">Observación</p>

        <div class="nurse-aux-modal__inset ncnsb-detail-body-inset">

          <p class="ncnsb-detail-body">{{ displayBody(dn) }}</p>

        </div>

      </div>



      <div class="modal-footer nurse-aux-modal__footer">

        <button

          type="button"

          class="btn-secondary-neuro ncnsb-notes-footer-btn"

          (click)="closeDetail()"

          i18n="@@ncnsb.detailDoneClose"

        >

          Cerrar

        </button>

      </div>

    </div>

  </div>

</div>
