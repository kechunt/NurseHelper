<div class="modal-backdrop modal-confirmation" role="presentation" (click)="onBackdrop()">
  <div
    class="modal-content modal-medication"
    appModalFocusTrap
    role="dialog"
    aria-modal="true"
    aria-labelledby="nurse-add-treatment-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h3 id="nurse-add-treatment-dialog-title">
        <span *ngIf="isFromPatient" i18n="@@nurseAddTreatmentModal.titleFromPatient"><app-bootstrap-icon name="shield-check" /> Nuevo tratamiento</span>
        <span *ngIf="!isFromPatient" i18n="@@nurseAddTreatmentModal.titleGlobal"><app-bootstrap-icon name="shield-check" /> Agregar Tratamiento Médico</span>
      </h3>
      <button
        id="nurse-add-treatment-header-close-btn"
        type="button"
        class="close-btn"
        aria-label="Cerrar"
        i18n-aria-label="@@nurseAddTreatmentModal.closeAriaLabel"
        (click)="onCancel()"
        [disabled]="isAdding"
      >
        ✕
      </button>
    </div>

    <div class="modal-body">
      <div *ngIf="patients.length === 0 && !isFromPatient" class="empty-state-modal">
        <div class="empty-icon"><app-bootstrap-icon name="users" /></div>
        <p class="empty-message" i18n="@@nurseAddTreatmentModal.emptyTitle"><app-bootstrap-icon name="exclamation-triangle" /> No hay pacientes disponibles</p>
        <p class="empty-hint" i18n="@@nurseAddTreatmentModal.emptyHint">
          Asigna pacientes a tu área para poder agregar tratamientos
        </p>
      </div>

      <p *ngIf="isFromPatient && fromPatientContext" class="treatment-patient-context" i18n="@@nurseAddTreatmentModal.patientContext">
        Paciente: <strong>{{ fromPatientContext.name }}</strong> — {{ fromPatientContext.bedNumber }}
      </p>

      <form class="medication-form" *ngIf="patients.length > 0 || isFromPatient">
        <div class="form-row" *ngIf="!isFromPatient">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.patientLabel">Paciente *</label>
            <select class="neuro-input" [(ngModel)]="newTreatment.patientId" name="patientId" required>
              <option value="" i18n="@@nurseAddTreatmentModal.selectPatientPlaceholder">Seleccionar paciente...</option>
              <option *ngFor="let patient of patients" [value]="patient.id">
                {{ patient.name }} ({{ patient.bedNumber }})
              </option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.descriptionLabel">Descripción del Tratamiento/Tarea *</label>
            <input
              type="text"
              class="neuro-input"
              [(ngModel)]="newTreatment.description"
              placeholder="Ej: Toma de signos vitales, Cambio de vendaje, Control de presión arterial..."
              i18n-placeholder="@@nurseAddTreatmentModal.descriptionPlaceholder"
              name="description"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.scheduleTypeLabel">Tipo de Programación *</label>
            <select
              class="neuro-input"
              [(ngModel)]="newTreatment.scheduleType"
              name="scheduleType"
              required
              (change)="onScheduleTypeChange()"
            >
              <option value="single" i18n="@@nurseAddTreatmentModal.scheduleSingle">Día y hora específica</option>
              <option value="recurring" i18n="@@nurseAddTreatmentModal.scheduleRecurring">Recurrente (diario / días de semana)</option>
            </select>
          </div>
        </div>

        <div *ngIf="newTreatment.scheduleType === 'single'" class="form-row two-cols">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.dateLabel">Fecha *</label>
            <input type="date" class="neuro-input" [(ngModel)]="newTreatment.date" name="date" [min]="getTodayDate()" required />
          </div>
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.timeLabel">Hora *</label>
            <input type="time" class="neuro-input" [(ngModel)]="newTreatment.time" name="time" required />
          </div>
        </div>

        <div *ngIf="newTreatment.scheduleType === 'recurring'" class="form-row">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.timesLabel">Horarios *</label>
            <div class="times-input-group">
              <div *ngFor="let time of newTreatment.times; let i = index" class="time-input-row">
                <input type="time" class="neuro-input small" [(ngModel)]="newTreatment.times[i]" [name]="'treatmentTime' + i" />
                <button
                  type="button"
                  class="remove-time-btn"
                  (click)="removeTreatmentTime(i)"
                  *ngIf="newTreatment.times.length > 1"
                  i18n-aria-label="@@nurseAddTreatmentModal.removeTimeAria"
                  title="Quitar horario"
                  i18n-title="@@nurseAddTreatmentModal.removeTimeTitle"
                >
                  ✕
                </button>
              </div>
              <button type="button" class="add-time-btn" (click)="addTreatmentTime()" i18n="@@nurseAddTreatmentModal.addTimeBtn">
                <app-bootstrap-icon name="plus-circle" /> Agregar hora
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="newTreatment.scheduleType === 'recurring'" class="form-row">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.applyDaysLabel">Días de aplicación *</label>
            <div class="days-selector">
              <label class="day-checkbox" *ngFor="let day of daysOfWeek">
                <input type="checkbox" [checked]="isTreatmentDaySelected(day.value)" (change)="toggleTreatmentDay(day.value)" />
                <span class="day-label">{{ day.label }}</span>
              </label>
              <button type="button" class="select-all-btn" (click)="selectAllTreatmentDays()" i18n="@@nurseAddTreatmentModal.selectAllDays">
                Todos
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="newTreatment.scheduleType === 'recurring'" class="form-row two-cols">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.durationLabel">Duración *</label>
            <input
              type="number"
              class="neuro-input"
              [(ngModel)]="newTreatment.duration"
              placeholder="Ej: 4"
              i18n-placeholder="@@nurseAddTreatmentModal.durationPlaceholder"
              name="duration"
              min="1"
              required
            />
          </div>
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.durationUnitLabel">Unidad</label>
            <select class="neuro-input" [(ngModel)]="newTreatment.durationUnit" name="durationUnit">
              <option value="weeks" i18n="@@nurseAddTreatmentModal.unitWeeks">Semanas</option>
              <option value="days" i18n="@@nurseAddTreatmentModal.unitDays">Días</option>
              <option value="months" i18n="@@nurseAddTreatmentModal.unitMonths">Meses</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label i18n="@@nurseAddTreatmentModal.notesLabel">Notas/Instrucciones</label>
            <textarea
              class="neuro-input"
              [(ngModel)]="newTreatment.notes"
              placeholder="Ej: Verificar temperatura antes, Aplicar con guantes..."
              i18n-placeholder="@@nurseAddTreatmentModal.notesPlaceholder"
              name="notes"
              rows="3"
            ></textarea>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-footer" *ngIf="patients.length > 0 || isFromPatient">
      <button
        id="nurse-add-treatment-cancel-btn"
        class="btn-secondary-neuro"
        type="button"
        (click)="onCancel()"
        [disabled]="isAdding"
        i18n="@@nurseAddTreatmentModal.cancel"
      >
        Cancelar
      </button>
      <button
        id="nurse-add-treatment-submit-btn"
        class="btn-primary-neuro"
        type="button"
        (click)="confirmAdd()"
        [disabled]="isAdding"
      >
        <span *ngIf="isAdding" i18n="@@nurseAddTreatmentModal.adding"><app-bootstrap-icon name="clock" /> Agregando...</span>
        <span *ngIf="!isAdding && isFromPatient" i18n="@@nurseAddTreatmentModal.submitFromPatient"><app-bootstrap-icon name="check-circle" /> Guardar tratamiento</span>
        <span *ngIf="!isAdding && !isFromPatient" i18n="@@nurseAddTreatmentModal.submitGlobal"><app-bootstrap-icon name="check-circle" /> Agregar Tratamiento</span>
      </button>
    </div>
  </div>
</div>
