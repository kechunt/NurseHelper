<app-staff-dashboard-shell
  #staffShell
  idPrefix="supervisor"
  [dashboardTitle]="supervisorShellDashboardTitle"
  panelHeadingId="supervisor-dashboard-heading"
  notificationsKind="supervisor"
  [roleDisplayLabel]="supervisorShellRoleDisplayLabel"
  [logoAriaLabel]="supervisorShellLogoAriaLabel"
  [navAriaLabel]="supervisorShellNavAriaLabel"
  [activeTab]="tabState.activeTab()"
  [tabs]="supervisorDashboardShellTabs"
  [userDisplayName]="headerUserDisplayName"
  [mobileDrawer]="true"
  (logoClick)="goToOverviewFromLogo()"
  (tabSelected)="setActiveTab($event)"
  (logoutClick)="logout()"
>
  <main
    staffShellMain
    class="dashboard-content"
    id="supervisor-dashboard-main"
    aria-labelledby="supervisor-dashboard-heading"
  >
    <button
      id="supervisor-shell-nav-hamburger-btn"
      type="button"
      class="nav-hamburger"
      (click)="staffShell.toggleNav()"
      [attr.aria-expanded]="staffShell.navOpen"
      [attr.aria-label]="supervisorHamburgerOpenNavAriaLabel"
    >
      <span class="hamburger-label">{{ hamburgerSectionLabel }}</span>
      <span class="hamburger-icon">☰</span>
    </button>

    <div
      *ngIf="hasVisitedTab('overview')"
      [hidden]="tabState.activeTab() !== 'overview'"
      class="tab-content"
      role="tabpanel"
      id="supervisor-panel-overview"
      aria-labelledby="supervisor-tab-overview"
    >
      <app-supervisor-system-overview [onNavigate]="setActiveTab.bind(this)"></app-supervisor-system-overview>
    </div>

    <div
      *ngIf="hasVisitedTab('backups')"
      [hidden]="tabState.activeTab() !== 'backups'"
      class="tab-content"
      role="tabpanel"
      id="supervisor-panel-backups"
      aria-labelledby="supervisor-tab-backups"
    >
      <app-supervisor-backups-section></app-supervisor-backups-section>
    </div>

    <div
      *ngIf="hasVisitedTab('health')"
      [hidden]="tabState.activeTab() !== 'health'"
      class="tab-content"
      role="tabpanel"
      id="supervisor-panel-health"
      aria-labelledby="supervisor-tab-health"
    >
      <app-supervisor-health-section></app-supervisor-health-section>
    </div>

    <div
      *ngIf="hasVisitedTab('audit')"
      [hidden]="tabState.activeTab() !== 'audit'"
      class="tab-content"
      role="tabpanel"
      id="supervisor-panel-audit"
      aria-labelledby="supervisor-tab-audit"
    >
      <app-supervisor-audit-section></app-supervisor-audit-section>
    </div>

    <div
      *ngIf="hasVisitedTab('webhooks')"
      [hidden]="tabState.activeTab() !== 'webhooks'"
      class="tab-content"
      role="tabpanel"
      id="supervisor-panel-webhooks"
      aria-labelledby="supervisor-tab-webhooks"
    >
      <app-supervisor-webhooks-section></app-supervisor-webhooks-section>
    </div>

    <div
      *ngIf="hasVisitedTab('platform')"
      [hidden]="tabState.activeTab() !== 'platform'"
      class="tab-content"
      role="tabpanel"
      id="supervisor-panel-platform"
      aria-labelledby="supervisor-tab-platform"
    >
      <app-supervisor-platform-section></app-supervisor-platform-section>
    </div>
  </main>
</app-staff-dashboard-shell>
